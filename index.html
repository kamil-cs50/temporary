<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlackBox Homebrew</title>
<style>
  body { margin: 0; background: #0a0a0b; color: #ececef; font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
  h1 { margin: 0 0 16px; letter-spacing: .06em; } h1 b { color: #e5262f; }
  code { display: block; background: #16161a; border: 1px solid #2a2a31; border-left: 3px solid #e5262f; padding: 10px 12px; border-radius: 8px; overflow-wrap: anywhere; }
  button, a.b { margin-top: 10px; background: #e5262f; color: #fff; border: 0; border-radius: 8px; padding: 9px 14px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
  .g { margin-top: 24px; background: #16161a; border: 1px solid #2a2a31; border-radius: 10px; padding: 14px; }
  .g a { color: #ff9aa0; overflow-wrap: anywhere; } .m { color: #9a9aa5; font-size: 13px; } .err { color: #ff9aa0; }
</style>
</head>
<body>
<main>
  <h1>BLACKBOX <b>HOMEBREW</b></h1>
  <p class="m">URL feedu:</p>
  <code id="u"></code>
  <button id="c" type="button">Kopiuj URL</button>
  <a class="b" href="catalog/catalogue-v2.json" target="_blank" rel="noopener">Surowy JSON</a>
  <div id="list"></div>
</main>
<script>
  var url = new URL('catalog/catalogue-v2.json', document.baseURI).href;
  document.getElementById('u').textContent = url;
  document.getElementById('c').onclick = function () { navigator.clipboard.writeText(url).then(function () { document.getElementById('c').textContent = 'Skopiowano'; }); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  fetch('catalog/catalogue-v2.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (d) {
    if (d.v !== 1 || !Array.isArray(d.games)) throw new Error('Brak "v": 1 lub listy "games".');
    document.getElementById('list').innerHTML = d.games.map(function (g) {
      return '<div class="g"><b>' + esc(g.title) + '</b> <span class="m">' + esc(g.id) + '</span>' +
        (g.releases || []).map(function (r) {
          return '<div><a href="' + esc(r.url) + '" target="_blank" rel="noopener noreferrer">' + esc(r.label || r.provider) + '</a> <span class="m">' + esc(r.format) + '</span></div>';
        }).join('') + '</div>';
    }).join('');
  }).catch(function (e) { document.getElementById('list').innerHTML = '<p class="err">Błąd katalogu: ' + esc(e.message) + '</p>'; });
</script>
</body>
</html>
